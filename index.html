<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3SVN DRIVER</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --accent: #0b7a35;
      --soft: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #30363d;
        --accent: #3fb950;
        --soft: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width: 780px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 4px; }
    h2 { font-size: 1.2rem; margin: 32px 0 8px; }
    .meta { color: var(--muted); margin: 0 0 16px; }
    .lang { display: flex; gap: 12px; margin: 0 0 24px; font-size: .95rem; }
    a { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: .95rem; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
    th { background: var(--soft); }
    .box { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
    @media (max-width: 560px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      td { border: 0; padding: 2px 0; }
      tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
      td:first-child { font-weight: 600; }
    }
  </style>
</head>
<body>
<main>
  <h1>3SVN DRIVER</h1>
  <p class="meta">SUPER SPEED LOGISTICS JSC · Công ty Cổ phần Tiếp vận Siêu tốc</p>

    <li><a href="delete-account.html">Xoá tài khoản</a> · <a href="delete-account.html#en">Delete your account</a></li>
  </ul>
</main>
</body>
</html>
